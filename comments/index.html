<script>
    const loadGitalk = () => {
        let gitalkId;
        let number = -1;
        // 加载评论模块
        Diversity.utils.loadComments('.gitalk-wrap')
            .then(() => Diversity.utils.getScript(conf.gitalk.js, {
                condition: window.Gitalk
            }))
            .then(() => {
                let issueTerm = conf.gitalk.issue_term;
                if (issueTerm === 'pathname') 
                    gitalkId = window.location.pathname;
                else if (issueTerm === 'url')
                    gitalkId = window.location.href;
                else if (issueTerm === 'title')
                    gitalkId = window.document.title;
                else if (Diversity.validate.test('pNum', issueTerm)) {
                    number = parseInt(issueTerm, 10);
                }
            })
            .then(() => {
                if (gitalkId)
                    Diversity.log("GitHub issue label is [" + gitalkId + "]");
                let confgObj = {
                    clientID: conf.gitalk.client_id,
                    clientSecret: conf.gitalk.client_secret,
                    repo: conf.gitalk.repo,
                    owner: conf.gitalk.github_id,
                    admin: [conf.gitalk.admin_user],
                    id: gitalkId,
                    labels: [],
                    number: number,
                    proxy: conf.gitalk.proxy,
                    distractionFreeMode: conf.gitalk.distraction_free_mode
                }
                if (conf.gitalk.language)
                    confgObj.language = conf.gitalk.language;
                const gitalk = new Gitalk(confgObj);
                gitalk.render(document.querySelector('.gitalk-wrap'));
            });
    }

    document.addEventListener('page:loaded', loadGitalk);
    document.addEventListener('color-scheme:refresh', loadGitalk);
</script>

    <script>
      // Store the collapsed state in localStorage
      const tocStateKey = 'toc_collapsed_state';
      
      document.addEventListener('DOMContentLoaded', function () {
        const nav = document.querySelector('nav');
        const toc = document.querySelector('#fixed-toc-container');
        const myDiv = document.getElementById('toggle_btn');
        const tocList = document.getElementById('fixed-toc-list');
        
        if (nav && toc) {
          const navBottom = nav.getBoundingClientRect().bottom;
          console.log('nav bottom:', navBottom);
          toc.style.top = navBottom + 'px';
          toc.style.maxHeight = (window.innerHeight - navBottom) + 'px';
        }
        
        // Restore previous collapsed state
        const wasCollapsed = localStorage.getItem(tocStateKey) === 'true';
        if (wasCollapsed) {
          tocList.style.display = 'none';
          myDiv.textContent = '>';
        }
      });

      const myDiv = document.getElementById('toggle_btn');
      const tocList = document.getElementById('fixed-toc-list');
      const tocContainer = document.getElementById('fixed-toc-container');
      
      function handleClickBtn() {
        console.log('TOC toggle clicked');
        if(myDiv.textContent === '<'){
          // Collapse
          myDiv.textContent = '>';
          tocList.style.display = 'none';
          localStorage.setItem(tocStateKey, 'true');
        } else {
          // Expand
          myDiv.textContent = '<';
          tocList.style.display = 'block';
          localStorage.setItem(tocStateKey, 'false');
        }
      }

      myDiv.addEventListener('click', handleClickBtn);
      myDiv.addEventListener('mouseover', function() {
        myDiv.style.backgroundColor = '#1a1a1a';
      });
      myDiv.addEventListener('mouseout', function() {
        myDiv.style.backgroundColor = '#101010';
      });

      (function() {
        const Patternstr = "/*\\d{4}/\\d{2}/\\d{2}/.*";
        const dataPattern = new RegExp(Patternstr);
        const path = window.location.pathname;
        console.log(dataPattern.toString(), path, dataPattern.test(path));
        
        if (!dataPattern.test(path) && (path === '/' || path === 'index.html')) {
          console.log('no toc');
          let toc = document.getElementById('fixed-toc-container');
          if (toc) toc.style.display = 'none';
          return;
        }
        
        var content = document.querySelector('body');
        console.log('content', content);
        
        if (!content || !tocList) {
          document.getElementById('fixed-toc-container').style.display = 'none';
          return;
        }
        
        var headings = content.querySelectorAll('h1, h2, h3, h4');
        console.log('headings', headings);
        
        // Position TOC on right if headings are too close to left
        if(headings && headings.length > 0){
          const h1Element = headings[0];
          const rect = h1Element.getBoundingClientRect();
          if(rect.left < 170){
            tocContainer.style.right = '0px';
            tocContainer.style.left = 'auto';
            tocContainer.style.borderLeft = 'none';
            tocContainer.style.borderRight = '2px solid #333';
            console.log('TOC positioned right');
          }
        }
        
        if (headings.length === 0) {
          document.getElementById('fixed-toc-container').style.display = 'none';
          return;
        }
        
        headings.forEach(function(heading, i) {
          if (!heading.id) {
            heading.id = 'heading-' + i;
          }
        });
        
        headings.forEach(function(heading) {
          var level = parseInt(heading.tagName.substring(1));
          var li = document.createElement('li');
          li.style.marginLeft = (level - 1) * 12 + 'px';
          li.style.marginBottom = '5px';
          li.style.wordWrap = 'break-word';
          li.style.wordBreak = 'break-word';
          
          var a = document.createElement('a');
          a.href = '#' + heading.id;
          a.textContent = heading.textContent;
          a.style.color = '#2bbc8a';
          a.style.textDecoration = 'none';
          a.style.fontSize = '0.9em';
          a.style.transition = 'all 0.2s ease';
          a.style.display = 'block';
          a.style.wordWrap = 'break-word';
          a.style.wordBreak = 'break-word';
          a.style.overflowWrap = 'break-word';
          
          a.onmouseover = function() { 
            a.style.textDecoration = 'underline';
            a.style.color = '#2ecc71';
          };
          a.onmouseout = function() { 
            a.style.textDecoration = 'none';
            a.style.color = '#2bbc8a';
          };
          
          li.appendChild(a);
          tocList.appendChild(li);
        });
      })();
    </script>
